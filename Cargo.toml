[package]
name = "cc-usage-tui"
version = "0.1.0"
edition = "2021"
description = "Read-only realtime TUI dashboard for cc-switch token/cost usage"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
opt-level = 2
lto = true
strip = true
